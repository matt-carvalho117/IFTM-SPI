<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo dos felinos</title>
    <script src="js/scriptJogo.js" defer></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main>
        <section class="gatos">
            <div>
                <div>
                    <img src="assets/gato01.gif" alt="" id="gato01">
                    <p>Clique em mim!</p>
                </div>
                <div>
                    <img src="assets/gato02.gif" alt="" id="gato02">
                    <p>Clique em min várias vezes!</p>
                    <p>Carinhos: <span id="carinhos">0</span></p>
                </div>
                <div>
                    <img src="assets/gato03.gif" alt="" id="gato03">
                    <p>Passe o cursor do mouse sobre mim!</p>
                </div>
                <div>
                    <img src="assets/gato04.gif" alt="" id="gato04">
                    <p id="texto">lá lá lá lá lá lá</p>
                </div>
                <div>
                    <img src="assets/gato05.gif" alt="" id="gato05">
                    <input type="button" id="gerarNumeroSorte" value="Gerar número da sorte">
                    <input type="text" id="resultadoSorte" readonly>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
