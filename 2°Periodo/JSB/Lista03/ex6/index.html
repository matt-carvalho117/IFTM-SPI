<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main>
        <b>Calculadora</b>
        <form action="">
            <div>
                <label for="valor1">1°Valor: </label>
                <input type="text" id="valor1">
            </div>
            <div>
                <label for="valor2">2°Valor: </label>
                <input type="text" id="valor2">
            </div>

            <div>
                <input type="button" value="+" id="soma">
                <input type="button" value="-" id="subtracao">
                <input type="button" value="*" id="multiplicacao">
                <input type="button" value="/" id="divisao">
            </div>

            <div>
                <label for="resultado">Resultado</label>
                <input type="text" id="resultado" readonly>
            </div>
        </form>
    </main>
</body>

</html>
